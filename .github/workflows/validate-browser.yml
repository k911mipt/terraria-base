name: Planner browser smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, test/browser-smoke]

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Contracts, construction, geometry and computed audit
        run: |
          node tools/check-materials.cjs
          node tools/check-renderers.cjs
          node tools/check-objects.cjs
          node tools/check-engineering-metadata.cjs
          node tools/check-building.cjs
          node tools/check-placement-fixes.cjs
          node tools/check-geometry.cjs
          node tools/check-audit.cjs
          node tools/audit-building.cjs
          node tools/audit-scene.cjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test-only browser dependency
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Real HTTP, four scenes, desktop, touch and audit regressions
        run: python tools/check-browser.py
      - name: Upload screenshots, network logs and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: planner-browser-smoke
          path: browser-artifacts/
          if-no-files-found: error
