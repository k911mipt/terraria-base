name: Planner browser smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, test/browser-smoke]

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test-only browser dependency
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Real HTTP, four scenes, desktop, touch and broken-resource regressions
        run: python tools/check-browser.py
      - name: Upload screenshots, network logs and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planner-browser-smoke
          path: browser-artifacts/
          if-no-files-found: error
