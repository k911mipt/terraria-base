name: Validate underground module ownership fix

on:
  push:
    branches:
      - fix/underground-object-module-column

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all planner scenes
        run: |
          node tools/check-data.cjs
          node tools/check-desert.cjs
          node tools/check-eternia.cjs
          node tools/check-underground.cjs

      - name: Validate changed JavaScript
        run: |
          node --check js/runtime/tables-underground.js
          node --check tools/check-underground.cjs

      - name: Smoke-test underground page
        run: |
          python3 -m http.server 8000 >/tmp/terraria-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8000/underground.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/js/runtime/tables-underground.js >/dev/null
