name: Planner performance profile

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/profile-planner.py'
      - 'tools/check-performance.py'
      - '.github/workflows/profile-planner.yml'

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install existing locked browser dependency
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Record GitHub CLI provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p performance-artifacts
          gh --version > performance-artifacts/gh-version.txt
          gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha > performance-artifacts/main-at-run.txt
      - name: Profile native HTTP scenes (no performance thresholds)
        run: |
          python tools/check-performance.py
          python tools/profile-planner.py --repeats 5 --output performance-artifacts/profiles
      - name: Upload raw measurements, allocation samples and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: planner-performance
          path: performance-artifacts/
          if-no-files-found: error
