name: Apply central desert shaft redesign

on:
  push:
    branches:
      - redesign/desert-central-shaft
    paths:
      - tools/apply-desert-central-shaft.cjs
      - .github/workflows/apply-desert-central-shaft.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/apply-desert-central-shaft.cjs
      - .github/workflows/apply-desert-central-shaft.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/desert-central-shaft
          fetch-depth: 0

      - name: Align current focus coordinates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply-desert-central-shaft.cjs')
          text = path.read_text()
          replacements = {
              'focusRect(12, 18, 56, 29, 2)': 'focusRect(12, 19, 56, 29, 2)',
              'focusRect(12, 18, 49, 29, 2)': 'focusRect(12, 19, 49, 29, 2)',
              'focusRect(25, 25, 56, 46, 2)': 'focusRect(25, 19, 56, 46, 2)',
              'focusRect(25, 25, 50, 46, 2)': 'focusRect(25, 19, 50, 46, 2)',
              'focusRect(51, 18, 64, 71, 2)': 'focusRect(51, 19, 64, 71, 2)',
              'focusRect(46, 18, 57, 71, 2)': 'focusRect(46, 19, 57, 71, 2)',
          }
          for source, target in replacements.items():
              text = text.replace(source, target)
          path.write_text(text)
          PY

      - name: Validate migration syntax
        run: node --check tools/apply-desert-central-shaft.cjs

      - name: Apply geometry changes
        run: node tools/apply-desert-central-shaft.cjs

      - name: Validate desert scene
        run: |
          node tools/check-desert.cjs
          for file in js/data/desert/*.js js/runtime/interactions-desert.js js/runtime/tables-desert.js; do
            node --check "$file"
          done

      - name: Remove one-time migration files
        run: |
          rm tools/apply-desert-central-shaft.cjs
          rm .github/workflows/apply-desert-central-shaft.yml

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            desert.html \
            docs/desert-outpost.md \
            js/data/desert/layout.js \
            js/data/desert/solids.js \
            js/data/desert/backgrounds.js \
            js/data/desert/objects.js \
            js/data/desert/engineering.js \
            js/runtime/interactions-desert.js \
            js/runtime/tables-desert.js \
            tools/check-desert.cjs \
            tools/apply-desert-central-shaft.cjs \
            .github/workflows/apply-desert-central-shaft.yml
          git commit -m "redesign: move desert shaft under the hatch"
          git push origin HEAD:redesign/desert-central-shaft
