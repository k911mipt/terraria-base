name: Apply Goblin underground workshop

on:
  push:
    branches:
      - feature/goblin-underground-workshop
    paths:
      - tools/.goblin-workshop.patch.gz.b64.part-*
      - .github/workflows/apply-goblin-underground-workshop.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/.goblin-workshop.patch.gz.b64.part-*
      - .github/workflows/apply-goblin-underground-workshop.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/goblin-underground-workshop
          fetch-depth: 0

      - name: Reconstruct and apply prepared patch
        run: |
          cat tools/.goblin-workshop.patch.gz.b64.part-* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/goblin-underground-workshop.patch
          git apply --check /tmp/goblin-underground-workshop.patch
          git apply --index /tmp/goblin-underground-workshop.patch

      - name: Validate all scenes and scripts
        run: |
          node tools/check-data.cjs
          node tools/check-desert.cjs
          node tools/check-eternia.cjs
          node tools/check-underground.cjs

          for file in \
            js/data/underground/*.js \
            js/runtime/interactions-underground.js \
            js/runtime/prepare-underground.js \
            js/runtime/start-underground.js \
            js/runtime/tables-underground.js \
            js/runtime/underground-extensions.js \
            js/runtime/start.js \
            js/runtime/start-desert.js \
            tools/check-underground.cjs; do
            node --check "$file"
          done

      - name: Smoke-test static pages
        run: |
          python3 -m http.server 8000 >/tmp/terraria-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8000/index.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/desert.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/underground.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/js/data/underground/objects.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/js/runtime/start-underground.js >/dev/null

      - name: Remove one-time migration files
        run: |
          rm tools/.goblin-workshop.patch.gz.b64.part-*
          rm .github/workflows/apply-goblin-underground-workshop.yml

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            README.md \
            docs/code-map.md \
            docs/underground-workshop.md \
            underground.html \
            js/data/underground/backgrounds.js \
            js/data/underground/engineering.js \
            js/data/underground/index.js \
            js/data/underground/layout.js \
            js/data/underground/materials.js \
            js/data/underground/objects.js \
            js/data/underground/solids.js \
            js/runtime/interactions-underground.js \
            js/runtime/prepare-underground.js \
            js/runtime/start-desert.js \
            js/runtime/start-underground.js \
            js/runtime/start.js \
            js/runtime/tables-underground.js \
            js/runtime/underground-extensions.js \
            tools/check-underground.cjs \
            tools/.goblin-workshop.patch.gz.b64.part-00 \
            tools/.goblin-workshop.patch.gz.b64.part-01 \
            tools/.goblin-workshop.patch.gz.b64.part-02 \
            tools/.goblin-workshop.patch.gz.b64.part-03 \
            .github/workflows/apply-goblin-underground-workshop.yml
          git commit -m "feature: add underground snow Goblin workshop"
          git push origin HEAD:feature/goblin-underground-workshop
