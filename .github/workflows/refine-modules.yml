      - name: Install temporary tools
        run: |
          npm install --prefix /tmp/refactor-tools \
            acorn@8.12.1 \
            prettier@3.3.3 \
            playwright@1.47.2

      - name: Refine source modules
        env:
          NODE_PATH: /tmp/refactor-tools/node_modules
        run: node /tmp/refine.cjs

      - name: Format source
        run: |
          /tmp/refactor-tools/node_modules/.bin/prettier --write \
            index.html \
            README.md \
            "docs/**/*.{md,json}" \
            "js/**/*.js" \
            "tools/**/*.cjs"

      - name: Validate data and JavaScript syntax
        run: |
          node tools/check-data.cjs
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check tools/check-data.cjs
          test ! -e js/data/base.js
          test ! -e js/runtime/bootstrap.js
          test -s js/runtime/interactions.js
          test -s js/runtime/tables.js
          grep -q 'js/data/index.js' index.html
          grep -q 'js/runtime/state.js' index.html
          grep -q 'js/runtime/start.js' index.html

      - name: Install Chromium
        run: /tmp/refactor-tools/node_modules/.bin/playwright install --with-deps chromium

      - name: Smoke-test the modular planner
        env:
          NODE_PATH: /tmp/refactor-tools/node_modules
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/terraria-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          cat > /tmp/smoke.cjs <<'NODE'
          "use strict";

          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            page.on("pageerror", (error) => pageErrors.push(error.stack || error.message));

            await page.goto("http://127.0.0.1:8000/", { waitUntil: "networkidle" });
            await page.waitForFunction(
              () => document.querySelectorAll("#storageRows tr").length === 86,
            );

            await page.click("#pitsBtn");
            await page.selectOption("#mode", "wiring");
            await page.fill("#search", "L_PIT_TIMER");
            await page.waitForTimeout(250);

            const result = await page.evaluate(() => ({
              status: document.querySelector("#status")?.textContent || "",
              storageRows: document.querySelectorAll("#storageRows tr").length,
              materialRows: document.querySelectorAll("#materialRows tr").length,
              canvasSizes: [...document.querySelectorAll("#viewport canvas")].map(
                (canvas) => [canvas.width, canvas.height],
              ),
            }));

            if (!result.status.includes("PASS")) throw new Error("PASS status missing");
            if (result.storageRows !== 86) throw new Error("Storage table changed");
            if (result.materialRows === 0) throw new Error("Material table is empty");
            if (result.canvasSizes.some(([width, height]) => width === 0 || height === 0)) {
              throw new Error("Canvas size is zero");
            }
            if (pageErrors.length) throw new Error(pageErrors.join("\n\n"));

            console.log(JSON.stringify(result, null, 2));
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          node /tmp/smoke.cjs

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/refine-modules.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "Refinement produced no changes"
            exit 1
          }
          git commit -m "refactor: clarify runtime module boundaries [skip ci]"
          git push origin HEAD:refactor/modular-source
