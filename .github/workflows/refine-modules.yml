name: Refine runtime module boundaries

on:
  push:
    branches:
      - refactor/modular-source
    paths:
      - .github/workflows/refine-modules.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/modular-source
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

