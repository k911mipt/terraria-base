      - name: Install temporary formatter and parser
        run: |
          npm install --prefix /tmp/refactor-tools \
            acorn@8.12.1 \
            prettier@3.3.3 \
            playwright@1.47.2

      - name: Generate modular source tree
        env:
          NODE_PATH: /tmp/refactor-tools/node_modules
        run: node /tmp/refactor.cjs

      - name: Format generated source
        run: |
          /tmp/refactor-tools/node_modules/.bin/prettier --write \
            index.html \
            styles.css \
            README.md \
            "docs/**/*.{md,json}" \
            "js/**/*.js" \
            "tools/**/*.cjs"

      - name: Validate data and JavaScript syntax
        run: |
          node tools/check-data.cjs
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check tools/check-data.cjs
          ! grep -q '<style>' index.html
          ! grep -q 'const D=' index.html
          grep -q 'styles.css' index.html
          grep -q 'js/data/base.js' index.html
          grep -q 'js/runtime/bootstrap.js' index.html

      - name: Install Chromium for browser smoke test
        run: /tmp/refactor-tools/node_modules/.bin/playwright install --with-deps chromium

      - name: Smoke-test the planner in a browser
        env:
          NODE_PATH: /tmp/refactor-tools/node_modules
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/terraria-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          cat > /tmp/smoke.cjs <<'NODE'
          "use strict";

          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];

            page.on("pageerror", (error) => pageErrors.push(error.stack || error.message));

            await page.goto("http://127.0.0.1:8000/", {
              waitUntil: "networkidle",
            });

            await page.waitForFunction(
              () => document.querySelectorAll("#storageRows tr").length === 86,
            );

            const initial = await page.evaluate(() => ({
              title: document.title,
              status: document.querySelector("#status")?.textContent || "",
              storageRows: document.querySelectorAll("#storageRows tr").length,
              roomRows: document.querySelectorAll("#roomRows tr").length,
              materialRows: document.querySelectorAll("#materialRows tr").length,
              canvases: [...document.querySelectorAll("#viewport canvas")].map((canvas) => ({
                width: canvas.width,
                height: canvas.height,
              })),
              viewport: {
                width: document.querySelector("#viewport")?.clientWidth || 0,
                height: document.querySelector("#viewport")?.clientHeight || 0,
              },
            }));

            if (!initial.title.includes("Terraria")) throw new Error("Unexpected document title");
            if (!initial.status.includes("PASS")) throw new Error(`Validation status missing: ${initial.status}`);
            if (initial.storageRows !== 86) throw new Error(`Storage rows: ${initial.storageRows}`);
            if (initial.roomRows === 0 || initial.materialRows === 0) {
              throw new Error("Specification tables were not rendered");
            }
            if (initial.viewport.width === 0 || initial.viewport.height === 0) {
              throw new Error("Viewport has zero size");
            }
            if (initial.canvases.some((canvas) => canvas.width === 0 || canvas.height === 0)) {
              throw new Error("A Canvas layer has zero size");
            }

            await page.click("#pitsBtn");
            await page.selectOption("#mode", "wiring");
            await page.waitForTimeout(250);
            await page.fill("#search", "L_PIT_TIMER");
            await page.waitForTimeout(250);

            if (pageErrors.length) {
              throw new Error(`Browser errors:\n${pageErrors.join("\n\n")}`);
            }

            console.log(JSON.stringify(initial, null, 2));
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          node /tmp/smoke.cjs

      - name: Remove one-time workflow and commit refactor
        shell: bash
        run: |
          rm -f .github/workflows/modularize.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "Refactor produced no changes"
            exit 1
          }
          git commit -m "refactor: split planner into readable modules [skip ci]"
          git push origin HEAD:refactor/modular-source
