name: Apply Jungle regression fixes

on:
  push:
    branches:
      - fix/jungle-navigation-textures
    paths:
      - tools/apply-jungle-regression-fixes.cjs
      - .github/workflows/apply-jungle-regression-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-jungle-regression-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jungle-navigation-textures
          fetch-depth: 0

      - name: Apply geometry, lighting and startup fixes
        run: node tools/apply-jungle-regression-fixes.cjs

      - name: Validate all planner scenes
        run: |
          node tools/check-data.cjs
          node tools/check-desert.cjs
          node tools/check-eternia.cjs
          node tools/check-underground.cjs
          node tools/check-lighting.cjs
          node tools/check-jungle.cjs
          node tools/check-jungle-rendering.cjs

      - name: Validate changed JavaScript
        run: |
          node --check js/data/jungle/materials.js
          node --check js/data/jungle/solids.js
          node --check js/data/jungle/objects.js
          node --check js/runtime/jungle-extensions.js
          node --check js/runtime/start.js
          node --check js/runtime/start-desert.js
          node --check js/runtime/start-underground.js
          node --check js/runtime/start-jungle.js
          node --check js/runtime/prepare-jungle.js
          node --check tools/check-jungle.cjs
          node --check tools/check-jungle-rendering.cjs

      - name: Remove one-time files
        run: |
          rm tools/apply-jungle-regression-fixes.cjs
          rm .github/workflows/apply-jungle-regression-fixes.yml

      - name: Commit applied source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore Jungle navigation and textured rendering"
          git pull --rebase origin fix/jungle-navigation-textures
          git push origin HEAD:fix/jungle-navigation-textures
