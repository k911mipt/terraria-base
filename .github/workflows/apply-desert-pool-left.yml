name: Apply desert pool-left redesign

on:
  push:
    branches:
      - redesign/desert-pool-left
    paths:
      - tools/apply-desert-pool-left.cjs
      - .github/workflows/apply-desert-pool-left.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/desert-pool-left
          fetch-depth: 0

      - name: Apply geometry changes
        run: node tools/apply-desert-pool-left.cjs

      - name: Validate desert scene
        run: |
          node tools/check-desert.cjs
          for file in js/data/desert/*.js js/runtime/interactions-desert.js js/runtime/tables-desert.js; do
            node --check "$file"
          done

      - name: Remove one-time migration files
        run: |
          rm tools/apply-desert-pool-left.cjs
          rm .github/workflows/apply-desert-pool-left.yml

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            desert.html \
            docs/desert-outpost.md \
            js/data/desert/layout.js \
            js/data/desert/solids.js \
            js/data/desert/backgrounds.js \
            js/data/desert/objects.js \
            js/data/desert/engineering.js \
            js/runtime/interactions-desert.js \
            js/runtime/tables-desert.js \
            tools/check-desert.cjs \
            tools/apply-desert-pool-left.cjs \
            .github/workflows/apply-desert-pool-left.yml
          git commit -m "redesign: move desert pool against left wall"
          git push origin HEAD:redesign/desert-pool-left
