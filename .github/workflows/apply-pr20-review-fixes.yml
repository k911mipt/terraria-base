name: Apply PR 20 review fixes

on:
  push:
    branches:
      - fix/underground-access-lighting-style
    paths:
      - tools/apply-pr20-review-fixes.cjs
      - .github/workflows/apply-pr20-review-fixes.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/apply-pr20-review-fixes.cjs
      - .github/workflows/apply-pr20-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/underground-access-lighting-style
          fetch-depth: 0

      - name: Apply review fixes
        run: node tools/apply-pr20-review-fixes.cjs

      - name: Validate all planner scenes
        run: |
          node tools/check-data.cjs
          node tools/check-desert.cjs
          node tools/check-eternia.cjs
          node tools/check-underground.cjs
          node tools/check-lighting.cjs

      - name: Validate changed JavaScript
        run: |
          node --check js/data/underground/objects.js
          node --check js/data/underground/solids.js
          node --check tools/check-lighting.cjs

      - name: Smoke-test underground page
        run: |
          python3 -m http.server 8000 >/tmp/terraria-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8000/underground.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/tools/check-lighting.cjs >/dev/null

      - name: Remove one-time migration files
        run: |
          rm tools/apply-pr20-review-fixes.cjs
          rm .github/workflows/apply-pr20-review-fixes.yml

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            js/data/underground/objects.js \
            js/data/underground/solids.js \
            tools/check-lighting.cjs \
            docs/building-rules.md \
            tools/apply-pr20-review-fixes.cjs \
            .github/workflows/apply-pr20-review-fixes.yml
          git commit -m "fix: require effective lights and supported lanterns"
          git push origin HEAD:fix/underground-access-lighting-style
