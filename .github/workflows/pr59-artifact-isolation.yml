name: Stage PR59 early-failure evidence (temporary)
on:
  push:
    branches: [maintenance/pr59-artifact-isolation-20260911]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve authored patch before checkout code
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr59-init"
          gh api "repos/$GH_REPO/contents/pr59-init-fix.patch?ref=75eb4d27471081a93a4ad0b505fd65c032ebc633" --jq .content | base64 -d > "$RUNNER_TEMP/pr59-init/changes.patch"
          echo "d24c462e3ef3d760aebceb608aa8d606b7fcc24bc7357f03ff395353fd61cdc7  $RUNNER_TEMP/pr59-init/changes.patch" | sha256sum -c -
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6eb27858faba97b6afbe15a682f8826177bd70ad
          persist-credentials: false
      - name: Publish verified tree and commit only, without moving any ref
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git apply --check "$RUNNER_TEMP/pr59-init/changes.patch"
          git apply "$RUNNER_TEMP/pr59-init/changes.patch"
          git diff --check
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(paths)=={'tools/profile-planner.py','tools/check-performance.py','docs/performance.md'}
          subprocess.run(['git','add','--',*paths],check=True)
          expected='7414cd8301e5f7d2151c9ef8e443006b4f03a6c6'
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==expected
          def api(endpoint,body=None):
              command=['gh','api','repos/'+os.environ['GH_REPO']+'/'+endpoint]
              if body is not None:command+=['--method','POST','--input','-']
              r=subprocess.run(command,input=json.dumps(body) if body is not None else None,text=True,capture_output=True)
              if r.returncode:raise RuntimeError(r.stderr)
              return json.loads(r.stdout)
          parent='6eb27858faba97b6afbe15a682f8826177bd70ad'
          pr=api('pulls/59');assert pr['state']=='open' and pr['head']['sha']==parent
          entries=[{'path':p,'mode':'100644','type':'blob','sha':api('git/blobs',{'content':Path(p).read_text(),'encoding':'utf-8'})['sha']} for p in paths]
          tree=api('git/trees',{'base_tree':'6898e1d4eb627620744af8bc9d3c8738f17f83de','tree':entries})['sha'];assert tree==expected
          commit=api('git/commits',{'tree':tree,'parents':[parent],'message':'fix: retain FAIL evidence for provenance and browser setup errors\n\nAddress PR59 initialization review. Guard git/digest/environment setup after claiming output; retain failed context/page and completed phases. Aggregate before PASS. No app/model/baseline changes; 19 unit regressions.'})['sha']
          out=Path(os.environ['RUNNER_TEMP'])/'pr59-init'
          receipt={'tree':tree,'parent':parent,'commit':commit,'refsUpdated':False}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2))
          subprocess.run(['git','archive','--format=tar','-o',str(out/'source.tar'),tree],check=True)
          print(json.dumps(receipt,indent=2))
          PY
      - name: Test without GitHub token
        shell: bash
        run: |
          python -m pip install -r requirements-dev.txt
          python tools/check-performance.py 2>&1 | tee "$RUNNER_TEMP/pr59-init/tests.log"
      - name: Preserve source and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr59-init-staged
          path: ${{ runner.temp }}/pr59-init/
          if-no-files-found: error
