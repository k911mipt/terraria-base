name: Stage PR59 artifact isolation (temporary)
on:
  push:
    branches: [maintenance/pr59-artifact-isolation-20260911]
permissions:
  contents: read
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 21c3e802f293a1694a0b5d1539499e738bc4b0e3
          persist-credentials: false
      - name: Retrieve exact patch whose 13 tests passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download 34541755162 --repo "$GH_REPO" --name pr59-artifact-isolation-stage --dir /tmp/pr59-recovery
          gh --version > /tmp/pr59-recovery/gh-version.txt
      - name: Verify patch and export tracked source without credentials
        run: |
          test "$(git rev-parse HEAD)" = 21c3e802f293a1694a0b5d1539499e738bc4b0e3
          git apply --check /tmp/pr59-recovery/changes.patch
          git apply /tmp/pr59-recovery/changes.patch
          git diff --check
          python - <<'PY'
          import subprocess,json
          from pathlib import Path
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(changed)=={'tools/profile-planner.py','tools/check-performance.py','docs/performance.md','.github/workflows/profile-planner.yml'}
          subprocess.run(['git','add','--',*changed],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          entries=[{'path':p,'mode':'100644','type':'blob','sha':subprocess.check_output(['git','hash-object',p],text=True).strip()} for p in changed]
          Path('/tmp/pr59-recovery/receipt.json').write_text(json.dumps({'tree':tree,'entries':entries},indent=2))
          subprocess.run(['git','archive','--format=tar','-o','/tmp/pr59-recovery/source.tar',tree],check=True)
          print(json.dumps({'tree':tree,'entries':entries},indent=2))
          PY
      - name: Preserve source and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr59-isolation-recovered
          path: /tmp/pr59-recovery/
          if-no-files-found: error
