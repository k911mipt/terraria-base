name: Stage PR59 report fixes (temporary)
on:
  push:
    branches: [maintenance/pr59-artifact-isolation-20260911]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact authored patch before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr59-report"
          gh api "repos/$GH_REPO/contents/pr59-report-fix.patch?ref=efb6d2671a52d9dcfaf5bbffbbbe2bd89735911e" --jq .content | base64 -d > "$RUNNER_TEMP/pr59-report/changes.patch"
          echo "083e149a73e6f8d08a2ea92f026def46bf7c79ae53221dec436481be0918fe21  $RUNNER_TEMP/pr59-report/changes.patch" | sha256sum -c -
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: bca39f84081a28b4d70a050b9cd5dc5c13b2fc18
          persist-credentials: false
      - name: Apply exact patch and publish Git objects, never refs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = bca39f84081a28b4d70a050b9cd5dc5c13b2fc18
          git apply --check "$RUNNER_TEMP/pr59-report/changes.patch"
          git apply "$RUNNER_TEMP/pr59-report/changes.patch"
          git diff --check
          python - <<'PY'
          import json,subprocess,os
          from pathlib import Path
          expected='6898e1d4eb627620744af8bc9d3c8738f17f83de'
          parent='bca39f84081a28b4d70a050b9cd5dc5c13b2fc18'
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(paths)=={'tools/profile-planner.py','tools/check-performance.py','docs/performance.md'}
          subprocess.run(['git','add','--',*paths],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==expected
          def api(endpoint,body=None):
              command=['gh','api','repos/'+os.environ['GH_REPO']+'/'+endpoint]
              if body is not None:command+=['--method','POST','--input','-']
              result=subprocess.run(command,input=json.dumps(body) if body is not None else None,text=True,capture_output=True)
              if result.returncode:raise RuntimeError(result.stderr)
              return json.loads(result.stdout)
          pr=api('pulls/59');assert pr['state']=='open' and pr['head']['sha']==parent
          entries=[{'path':p,'mode':'100644','type':'blob','sha':api('git/blobs',{'content':Path(p).read_text(),'encoding':'utf-8'})['sha']} for p in paths]
          tree=api('git/trees',{'base_tree':api('git/commits/'+parent)['tree']['sha'],'tree':entries})['sha']
          assert tree==expected
          commit=api('git/commits',{'tree':tree,'parents':[parent],'message':'fix: retain failed profiles and fingerprint the loaded favicon\n\nAddress PR59 review. Failed attempts remain in run summary; digest v2 includes SVG without rewriting historical metrics. 16 regression tests; no application edits.'})['sha']
          receipt={'commit':commit,'tree':tree,'parent':parent,'refsUpdated':False}
          out=Path(os.environ['RUNNER_TEMP'])/'pr59-report'
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2))
          subprocess.run(['git','archive','--format=tar','-o',str(out/'source.tar'),tree],check=True)
          print(json.dumps(receipt,indent=2))
          PY
      - name: Run regression tests without GitHub token
        shell: bash
        run: |
          python -m pip install -r requirements-dev.txt
          python tools/check-performance.py 2>&1 | tee "$RUNNER_TEMP/pr59-report/tests.log"
      - name: Preserve source and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr59-report-staged
          path: ${{ runner.temp }}/pr59-report/
          if-no-files-found: error
