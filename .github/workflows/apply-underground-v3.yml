name: Apply underground access, lighting and room style fixes

on:
  push:
    branches:
      - fix/underground-access-lighting-style
    paths:
      - tools/.apply-underground-v3.cjs.gz.b64.part-*
      - .github/workflows/apply-underground-v3.yml
  pull_request:
    branches:
      - main

concurrency:
  group: apply-underground-v3
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/underground-access-lighting-style
          fetch-depth: 0

      - name: Reconstruct and run migration
        run: |
          cat tools/.apply-underground-v3.cjs.gz.b64.part-* \
            | base64 --decode \
            > /tmp/apply-underground-v3.cjs.gz
          echo "bd3e062a0b25b7dcbd95a3bb7b5da1f787988cc8c9969d929fb431d93f83a586  /tmp/apply-underground-v3.cjs.gz" \
            | sha256sum --check -
          gzip --decompress --stdout /tmp/apply-underground-v3.cjs.gz \
            > /tmp/apply-underground-v3.cjs
          node --check /tmp/apply-underground-v3.cjs
          node /tmp/apply-underground-v3.cjs

          # Keep the water-volume invariant visible in the HTML summary.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("underground.html")
          source = path.read_text(encoding="utf-8")
          old = "рыболовному сундуку открыт, а четыре зоны проверяются по освещённости."
          new = (
              "рыболовному сундуку открыт; водоём 20×16 содержит 320 тайлов воды, "
              "а четыре зоны проверяются по освещённости."
          )
          if old not in source:
              raise SystemExit("Expected underground HTML summary was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate every planner scene
        run: |
          node tools/check-data.cjs
          node tools/check-desert.cjs
          node tools/check-eternia.cjs
          node tools/check-underground.cjs
          node tools/check-lighting.cjs

      - name: Validate changed JavaScript
        run: |
          for file in \
            js/data/underground/*.js \
            js/runtime/underground-extensions.js \
            js/runtime/tables-underground.js \
            tools/check-underground.cjs \
            tools/check-lighting.cjs; do
            node --check "$file"
          done

      - name: Smoke-test static pages
        run: |
          python3 -m http.server 8000 >/tmp/terraria-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8000/index.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/desert.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/underground.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/js/runtime/underground-extensions.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/tools/check-lighting.cjs >/dev/null

      - name: Remove one-time migration files
        run: |
          rm tools/.apply-underground-v3.cjs.gz.b64.part-*
          rm .github/workflows/apply-underground-v3.yml

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            README.md \
            docs/building-rules.md \
            docs/underground-workshop.md \
            underground.html \
            js/data/underground/layout.js \
            js/data/underground/solids.js \
            js/data/underground/backgrounds.js \
            js/data/underground/objects.js \
            js/data/underground/index.js \
            js/data/underground/materials.js \
            js/runtime/underground-extensions.js \
            js/runtime/tables-underground.js \
            tools/check-underground.cjs \
            tools/check-lighting.cjs \
            tools/.apply-underground-v3.cjs.gz.b64.part-00 \
            tools/.apply-underground-v3.cjs.gz.b64.part-01 \
            tools/.apply-underground-v3.cjs.gz.b64.part-02 \
            tools/.apply-underground-v3.cjs.gz.b64.part-03 \
            tools/.apply-underground-v3.cjs.gz.b64.part-04 \
            .github/workflows/apply-underground-v3.yml
          git commit -m "fix: open underground access and improve room lighting"
          git push origin HEAD:fix/underground-access-lighting-style
