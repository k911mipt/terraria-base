name: Validate platform background continuity

on:
  push:
    branches:
      - fix/desert-platform-backgrounds
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate data and JavaScript
        run: |
          node tools/check-data.cjs
          node tools/check-desert.cjs
          node --check js/data/desert/backgrounds.js
          node --check js/data/desert/engineering.js
          node --check tools/check-desert.cjs
