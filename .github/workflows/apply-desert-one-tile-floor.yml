name: Apply one-tile desert floor redesign

on:
  push:
    branches:
      - redesign/desert-one-tile-floor
    paths:
      - tools/apply-desert-one-tile-floor.cjs
      - .github/workflows/apply-desert-one-tile-floor.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/apply-desert-one-tile-floor.cjs
      - .github/workflows/apply-desert-one-tile-floor.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/desert-one-tile-floor
          fetch-depth: 0

      - name: Escape nested template literals in the one-time generator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply-desert-one-tile-floor.cjs')
          text = path.read_text()
          for source, target in [
              ('`${solid.name || solid.mat} outside bounds`', '`\\${solid.name || solid.mat} outside bounds`'),
              ('`${background.name || background.mat} outside bounds`', '`\\${background.name || background.mat} outside bounds`'),
              ('`${object.id} outside bounds`', '`\\${object.id} outside bounds`'),
              ('`- ${error}`', '`- \\${error}`'),
          ]:
              text = text.replace(source, target)
          path.write_text(text)
          PY

      - name: Apply geometry changes
        run: node tools/apply-desert-one-tile-floor.cjs

      - name: Validate desert scene
        run: |
          node tools/check-desert.cjs
          for file in js/data/desert/*.js js/runtime/interactions-desert.js js/runtime/tables-desert.js; do
            node --check "$file"
          done

      - name: Remove one-time migration files
        run: |
          rm tools/apply-desert-one-tile-floor.cjs
          rm .github/workflows/apply-desert-one-tile-floor.yml

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            desert.html \
            docs/desert-outpost.md \
            js/data/desert/layout.js \
            js/data/desert/solids.js \
            js/data/desert/backgrounds.js \
            js/data/desert/objects.js \
            js/data/desert/engineering.js \
            js/runtime/interactions-desert.js \
            js/runtime/tables-desert.js \
            tools/check-desert.cjs \
            tools/apply-desert-one-tile-floor.cjs \
            .github/workflows/apply-desert-one-tile-floor.yml
          git commit -m "redesign: replace desert foundation with lower room"
          git push origin HEAD:redesign/desert-one-tile-floor
