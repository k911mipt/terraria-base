name: Apply dual-purpose Eternia arena

on:
  push:
    branches:
      - feature/eternia-dual-purpose-arena
    paths:
      - tools/apply-eternia.cjs
      - .github/workflows/apply-eternia.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eternia-dual-purpose-arena
          fetch-depth: 0

      - name: Validate migration syntax
        run: node --check tools/apply-eternia.cjs

      - name: Apply arena integration
        run: node tools/apply-eternia.cjs

      - name: Validate planner data
        run: |
          node tools/check-data.cjs
          node tools/check-desert.cjs
          node tools/check-eternia.cjs
          node --check js/data/objects/eternia.js
          node --check js/data/objects/index.js
          node --check tools/check-data.cjs
          node --check tools/check-eternia.cjs

      - name: Remove one-time migration files
        run: |
          rm tools/apply-eternia.cjs
          rm .github/workflows/apply-eternia.yml

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            index.html \
            README.md \
            docs/code-map.md \
            docs/eternia-arena.md \
            js/data/objects/eternia.js \
            js/data/objects/index.js \
            tools/check-data.cjs \
            tools/check-eternia.cjs \
            tools/apply-eternia.cjs \
            .github/workflows/apply-eternia.yml
          git commit -m "feature: add dual-purpose Eternia arena"
          git push origin HEAD:feature/eternia-dual-purpose-arena
